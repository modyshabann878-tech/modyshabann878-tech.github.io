<style>
:root{--bg:#fff;--soft:#F3F7FE;--ink:#0F2A4A;--mute:#5B6B82;--card:#fff;--line:#DCE5F3;--blue:#2563EB;--blue-d:#1D4ED8;--red:#DC2626;--redsoft:#FEF2F2;--redline:#FECACA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--soft:#101A2E;--ink:#E8EEF9;--mute:#9FB0C8;--card:#131E36;--line:#22314F;--blue:#5B8CFF;--blue-d:#2F63E0;--red:#EF4444;--redsoft:#2A1519;--redline:#5C2229}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.8;overflow-x:hidden}
h1,h2,h3{font-weight:800;line-height:1.3;margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.hero{background:linear-gradient(180deg,var(--soft),var(--bg))}
.nav{display:flex;justify-content:space-between;align-items:center;padding-top:18px;padding-bottom:18px;gap:12px}
.nav b{font-size:1.1rem}.nav div{display:flex;gap:16px}
.nav a{color:var(--mute);text-decoration:none;font-weight:600;font-size:.95rem}.nav a:hover{color:var(--blue)}
.hero-in{display:flex;flex-wrap:wrap;align-items:center;gap:36px;justify-content:center;padding-top:28px;padding-bottom:64px}
.photo{width:220px;height:220px;border-radius:50%;background:var(--soft);border:6px solid var(--bg);box-shadow:0 0 0 4px var(--blue),0 18px 40px rgba(37,99,235,.25);overflow:hidden;display:grid;place-items:center;font-size:64px;flex:none}
.photo img{width:100%;height:100%;object-fit:cover}
.hero-text{flex:1 1 280px;min-width:0}
h1{font-size:clamp(2.2rem,8vw,3.6rem)}
h1 small{display:block;font-size:.4em;color:var(--blue);font-weight:700}
.hero-text p{font-size:1.15rem;color:var(--mute);max-width:34ch;margin:8px 0 22px}
.btn{display:inline-block;padding:10px 26px;border-radius:10px;background:var(--blue-d);color:#fff;font:inherit;font-weight:700;text-decoration:none;border:2px solid var(--blue-d);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent;color:var(--blue);border-color:var(--blue);margin-inline-start:8px}
section{padding:36px 0}
h2{font-size:clamp(1.6rem,5vw,2.1rem);margin-bottom:20px}
h2::after{content:"";display:block;width:56px;height:4px;border-radius:2px;background:var(--blue);margin-top:4px}
.sec-red{background:var(--redsoft);border:1px solid var(--redline);border-radius:22px;padding:30px 22px}
.sec-red h2::after{background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.work{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:start;padding:0;font:inherit;color:inherit;box-shadow:0 2px 10px rgba(15,42,74,.08);transition:box-shadow .2s}
.work:hover{box-shadow:0 8px 24px rgba(15,42,74,.16)}
.thumb{aspect-ratio:16/9;background:var(--soft);display:grid;place-items:center;font-size:48px;position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.v::after{content:"\25B6";position:absolute;z-index:1;width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;font-size:20px;display:grid;place-items:center;padding-inline-start:3px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.badge{position:absolute;z-index:1;top:10px;right:10px;border-radius:999px;padding:0 12px;font-size:.8rem;font-weight:700;color:#fff}
.b-video{background:var(--red)}.b-game{background:var(--blue-d)}
.info{padding:12px 16px 16px}.info h3{font-size:1.15rem}.info p{margin:2px 0 0;font-size:.9rem;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:18px;max-width:560px;width:calc(100% - 32px);padding:0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(8,16,32,.7)}
.m-top{aspect-ratio:16/9;display:grid;place-items:center;font-size:72px;background:var(--soft)}
.m-body{padding:18px 24px 26px}.m-body p{margin:6px 0 18px;color:var(--mute)}
.close{float:left;font:inherit;font-weight:700;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px 16px;margin:12px;cursor:pointer}
.about{color:#fff;border-radius:20px;padding:32px 28px;background:linear-gradient(135deg,#1D4ED8,#1E3A8A)}.about h2::after{background:#fff}.about p{max-width:55ch;font-size:1.08rem;margin:0;white-space:pre-line}
.contact{display:flex;flex-wrap:wrap;gap:12px}
.contact a{padding:9px 22px;border-radius:10px;border:2px solid var(--blue);text-decoration:none;font-weight:700;color:var(--blue)}
.contact a:hover{background:var(--blue-d);color:#fff}
.contact a[href*="youtube.com"]{background:var(--red);border-color:var(--red);color:#fff}
footer{text-align:center;padding:30px 0 40px;color:var(--mute);border-top:1px solid var(--line);margin-top:30px}
#editBtn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.ed-body{padding:18px 22px 24px}.ed-body label{display:block;font-weight:600;margin-top:12px}
.ed-body input,.ed-body textarea,.ed-body select{width:100%;font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ed-work{border:1px dashed var(--blue);border-radius:14px;padding:12px 14px;margin-top:16px}
.ed-body .sm{font:inherit;font-weight:700;border:0;border-radius:8px;padding:6px 16px;cursor:pointer;margin-top:10px;background:var(--blue-d);color:#fff}
.ed-body .del{background:var(--red)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<script>
const S=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label={video:'فيديو',game:'لعبة'},EMO={video:'▶',game:'🎮'};
const COLORS=['#FF4F81','#2EC4FF','#7B5CFF','#2ED9A3','#FFC83D'];
const url=u=>/^https?:\/\//i.test((u||'').trim())?u.trim():'';
let filter='all';
let liveVideos=[];

function shell(){
  const wa='https://wa.me/20'+String(S.phone).replace(/\D/g,'').replace(/^0/,'');
  $('#app').innerHTML=`
<header class="hero"><nav class="wrap nav"><b>${esc(S.name)}</b><div><a href="#videos">فيديوهات</a><a href="#games">ألعاب</a><a href="#contact">تواصل</a></div></nav>
<div class="wrap hero-in"><div class="photo">${S.photo?`<img alt="${esc(S.name)}" src="${S.photo}">`:'😎'}</div>
<div class="hero-text"><h1><small>أهلاً، أنا</small>${esc(S.name)}</h1><p>${esc(S.tagline)}</p><a class="btn" href="#videos">شوف فيديوهاتي</a><a class="btn ghost" href="#contact">تواصل معايا</a></div></div></header>
<main class="wrap">
<section id="videos" class="sec-red"><h2>فيديوهات اليوتيوب</h2><div class="grid" id="gridV"></div></section><section id="games"><h2>ألعابي</h2><div class="grid" id="gridG"></div></section>
<section id="about"><div class="about"><h2>عني</h2><p>${esc(S.about)}</p></div></section>
<section id="contact"><h2>كلمني</h2><div class="contact">
<a href="${wa}" target="_blank" rel="noopener">واتساب</a><a href="tel:${esc(S.phone)}">اتصل: ${esc(S.phone)}</a>
${url(S.youtube)?`<a href="${esc(url(S.youtube))}" target="_blank" rel="noopener">يوتيوب</a>`:''}
${url(S.instagram)?`<a href="${esc(url(S.instagram))}" target="_blank" rel="noopener">انستجرام</a>`:''}
</div></section></main>
<footer>© 2026 ${esc(S.name)}</footer>
<dialog id="dlg"><button class="close" id="close">إغلاق</button><div class="m-top" id="mTop"></div>
<div class="m-body"><h3 id="mTitle"></h3><p id="mDesc"></p><a class="btn" id="mLink" target="_blank" rel="noopener"></a></div></dialog>
<dialog id="ed"></dialog><button class="btn" id="editBtn" hidden>✏️ تعديل الموقع</button>`;
  $('#close').onclick=()=>$('#dlg').close();
  $('#dlg').onclick=e=>{if(e.target.id==='dlg')$('#dlg').close()};
  
  $('#editBtn').onclick=openEd;
  grid();owner();
}
function grid(){
  [['video','#gridV','#videos'],['game','#gridG','#games']].forEach(([ty,sel,sec])=>{
    const g=$(sel);g.innerHTML='';
    const list=[...S.works.filter(w=>w.type===ty),...(ty==='video'?liveVideos.filter(l=>!S.works.some(w=>w.link===l.link)):[])];
    $(sec).hidden=!list.length;
    list.forEach(w=>{
      const b=document.createElement('button');b.className='work';
      b.innerHTML=`<div class="thumb ${ty==='video'?'v':''}">${w.image?`<img alt="${esc(w.title)}" src="${w.image}">`:EMO[w.type]}<span class="badge b-${w.type}">${label[w.type]}</span></div><div class="info"><h3>${esc(w.title)}</h3><p>${esc(w.desc)}</p></div>`;
      b.onclick=()=>{
        const t=$('#mTop');t.style.background=w.image?`url(${w.image}) center/cover`:'';t.textContent=w.image?'':EMO[w.type];
        $('#mTitle').textContent=w.title;$('#mDesc').textContent=w.desc;
        const a=$('#mLink');a.textContent=ty==='game'?'العب دلوقتي':'شاهد على يوتيوب';a.className='btn'+(ty==='video'?' red':'');
        if(url(w.link)){a.href=url(w.link);a.hidden=false}else a.hidden=true;
        $('#dlg').showModal();
      };
      g.appendChild(b);
    });
  });
}
function shrink(file,max){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};im.src=fr.result};fr.readAsDataURL(file)})}

async function owner(){
  try{const u=await claude.use('user');if(u&&u.isOwner())$('#editBtn').hidden=false}catch(e){}
}
function openEd(){edDraw();$('#ed').showModal()}
function edDraw(){
  const f=(k,l,ta)=>`<label>${l}${ta?`<textarea rows="3" data-k="${k}">${esc(S[k])}</textarea>`:`<input data-k="${k}" value="${esc(S[k])}">`}</label>`;
  $('#ed').innerHTML=`<div class="ed-body"><h2>تعديل الموقع</h2>
${f('name','الاسم')}${f('tagline','جملة تحت الاسم')}${f('about','نبذة عنك',1)}${f('phone','رقم التواصل')}${f('youtube','رابط قناة يوتيوب')}${f('instagram','رابط انستجرام')}
<label>صورتك<input type="file" accept="image/*" id="fPhoto"></label>
<h3 style="margin-top:22px">الأعمال</h3>
${S.works.map((w,i)=>`<div class="ed-work">
<label>النوع<select data-w="${i}:type"><option value="video"${w.type==='video'?' selected':''}>فيديو</option><option value="game"${w.type==='game'?' selected':''}>لعبة</option></select></label>
<label>الاسم<input data-w="${i}:title" value="${esc(w.title)}"></label>
<label>وصف قصير<input data-w="${i}:desc" value="${esc(w.desc)}"></label>
<label>الرابط (يوتيوب أو رابط اللعبة)<input data-w="${i}:link" value="${esc(w.link)}" placeholder="https://"></label>
<label>صورة العمل<input type="file" accept="image/*" data-img="${i}"></label>
<button class="sm del" data-del="${i}">حذف العمل</button></div>`).join('')}
<button class="sm" id="addW">+ إضافة عمل</button>
<div style="margin-top:22px"><button class="btn" id="save">حفظ ونشر</button> <button class="sm" id="cancel" style="background:var(--sun)">إلغاء</button></div>
<p id="msg"></p></div>`;
  const d=$('#ed');
  d.oninput=e=>{const t=e.target;if(t.dataset.k)S[t.dataset.k]=t.value;else if(t.dataset.w){const[i,k]=t.dataset.w.split(':');S.works[i][k]=t.value}};
  d.onchange=async e=>{const t=e.target;if(t.type!=='file'||!t.files[0])return;
    const v=await shrink(t.files[0],500);if(t.id==='fPhoto')S.photo=v;else S.works[t.dataset.img].image=v;edDraw()};
  d.onclick=e=>{const t=e.target;
    if(t.dataset.del!==undefined){e.preventDefault();S.works.splice(+t.dataset.del,1);edDraw()}
    if(t.id==='addW'){S.works.push({type:'video',title:'عمل جديد',desc:'',link:'',image:''});edDraw()}
    if(t.id==='cancel')location.reload();
    if(t.id==='save')save()};
}
async function save(){
  const msg=$('#msg');msg.textContent='جاري الحفظ...';
  try{
    const art=await claude.use('artifact');if(!art){msg.textContent='الحفظ مش متاح هنا. افتح الموقع من حسابك وجرب تاني.';return}
    shell();
    const c=document.documentElement.cloneNode(true);
    c.querySelector('#app').innerHTML='';
    c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
    await art.publish('<!DOCTYPE html>\n'+c.outerHTML);
  }catch(e){msg.textContent='حصلت مشكلة في الحفظ، جرب تاني.'}
}
shell();
fetch('videos.json').then(r=>r.json()).then(list=>{liveVideos=list.map(v=>({type:'video',title:v.title,desc:'فيديو جديد على يوتيوب',link:v.url,image:v.thumbnail}));grid()}).catch(()=>{});
</script>
</body>
</html>
